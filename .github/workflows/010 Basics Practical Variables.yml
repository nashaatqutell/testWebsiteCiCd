name: 010 Basics Practical Variables CI/CD

on:
    workflow_dispatch:

jobs:
    print-hello-world:
        runs-on: ubuntu-latest
        steps:
            - name: testing environment
              run: exit 1

            - name: open issue
              run: |
                curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.TOKEN_FOR_ISSUE }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                ${{ vars.CREATE_ISSUE_API }} \
                -d '{"title":"Found a bug","body":"this there is the issue."}'
