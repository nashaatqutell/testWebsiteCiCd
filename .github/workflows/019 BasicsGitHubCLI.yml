name: 019 BasicsGitHubCLI CI/CD
on:
    workflow_dispatch:

permissions:
  issues: write
jobs:
    print-hello-world:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4.2.2

            - name: open issue
              run: gh issue create --title "I found a bug" --body "Nothing works"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
