name: 013 basics needs CI/CD
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: build app
              run: echo "running build app"

    test:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: test app
              run: echo "running test app"

    deploy:
        runs-on: ubuntu-latest
        needs: [build, test]
        steps:
            - name: deploy app
              run: echo "running deploy app"
