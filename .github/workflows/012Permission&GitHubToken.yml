name: 012 Permission&GitHubToken CI/CD
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  print-hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: testing environment
        run: exit 1

      - name: open issue
        if: failure()
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          ${{ vars.CREATE_ISSUE_API }} \
          -d '{"title":"there is the issue for permission and github token","body":"this there is the issue."}'
