name: 020 ExampleCommentingOnPr CI/CD
on:
  pull_request:
    types: [closed]


permissions:
  issues: write
  pull-requests: write

jobs:
  print-hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Comment on PR
        if: github.event.pull_request.merged == false
        run: gh pr comment $PR_NUMBER --body "we found some issues in your code, please fix this issue and try again to merge it"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
