name: 011 Basics Workflow Expression CI/CD
on:
    workflow_dispatch:

env:
    SEARCH_KEY: ${{contains('Hello world', 'word') && 'the key exists' || 'the key does not exist'}}

jobs:
    print-hello-world:
        runs-on: ubuntu-latest
        steps:
            - name: Print search key
              run: echo ${{env.SEARCH_KEY}}
